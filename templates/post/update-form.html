<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>templates/post/update-form.html</title>
</head>
<body>
    <div class="container">
        <h3>글 수정 폼</h3>
        <form action="/post/update/{{ post.num }}" method="post">
            <input type="hidden" name="num" value="{{ post.num }}">
            <label for="writer">작성자</label>
            <input type="text" name="writer" id="writer" value="{{ post.writer }}" readonly>
            <br>
            <label for="title">제목</label>
            <input type="text" name="title" id="title" value="{{ post.title }}">
            <br>
            <label for="content">내용</label>
            <textarea name="content" id="content" rows="10">{{ post.content }}</textarea>
            <br>
            <button type="submit">수정 확인</button>
            <a href="/post">취소</a>
        </form> 
    </div>
</body>
</html>
